<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Office Radio - Admin</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="card">
    <h1>🛠️ Admin Dashboard</h1>

    <section id="loginSection">
      <input id="username" placeholder="Username" value="admin" />
      <input id="password" type="password" placeholder="Password" value="admin123" />
      <button id="btnLogin">Login</button>
      <p class="hint">Gunakan ADMIN_PASS_HASH di production (lihat README)</p>
    </section>

    <section id="adminSection" style="display:none">
      <p><strong>Icecast:</strong> <span id="icecastStatus">Checking...</span></p>
      <label>Nama Program</label>
      <input id="programInput" placeholder="Nama program" />

      <label>Now Playing</label>
      <input id="nowPlayingInput" placeholder="Now playing" />

      <label>Status Siaran</label>
      <select id="isLiveInput">
        <option value="true">Live</option>
        <option value="false">Off Air</option>
      </select>

      <button id="btnSave">Simpan Update</button>
      <button id="btnLogout">Logout</button>
      <p id="adminMessage"></p>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
